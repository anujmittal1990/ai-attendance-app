<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Camera Attendance System</title>
    <!-- Load Face-API Library -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/dist/face-api.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 30px; 
            background: #f4f4f9; 
        }
        .controls {
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 5px;
            transition: background 0.3s;
        }
        .btn-primary { background: #007bff; color: white; }
        .btn-primary:hover { background: #0056b3; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; }
        .btn-info { background: #17a2b8; color: white; }
        .btn-info:hover { background: #138496; }
        .btn:disabled { background: #cccccc; cursor: not-allowed; }
        
        .container {
            position: relative;
            display: inline-block;
        }
        video { 
            border: 4px solid #333; 
            border-radius: 8px; 
            transform: scaleX(-1); 
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            transform: scaleX(-1);
        }
        #status { 
            font-size: 1.2rem; 
            font-weight: bold; 
            color: #007bff; 
            margin-top: 15px; 
        }
        
        #registration-form {
            display: none;
            margin: 15px auto;
            padding: 15px;
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 320px;
        }
        #registration-form input {
            width: 90%;
            padding: 8px;
            margin: 6px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* Attendance Table Styling */
        #logs-view {
            display: none;
            margin: 20px auto;
            max-width: 700px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <h2>AI Face Recognition Attendance</h2>
    
    <div class="controls">
        <button id="btn-attendance" class="btn btn-primary" onclick="switchMode('attendance')" disabled>Mark Attendance</button>
        <button id="btn-register" class="btn btn-success" onclick="switchMode('register')" disabled>Add New Employee</button>
        <button id="btn-logs" class="btn btn-info" onclick="switchMode('logs')">View Logs</button>
    </div>

    <!-- Registration Form Block -->
    <div id="registration-form">
        <h3>Register New Face</h3>
        <input type="text" id="reg-user-id" placeholder="User ID (e.g., EMP001)" required />
        <input type="text" id="reg-name" placeholder="Full Name" required />
        <button class="btn btn-success" style="margin-top: 10px;" onclick="captureAndRegister()">Capture & Save</button>
    </div>

    <!-- Attendance Logs View -->
    <div id="logs-view">
        <h3>Attendance Logs</h3>
        <div style="margin-bottom: 10px;">
            <label for="filter-date"><strong>Filter by Date: </strong></label>
            <input type="date" id="filter-date" onchange="fetchAttendanceLogs()" />
            <button class="btn btn-info" style="padding: 5px 10px;" onclick="clearDateFilter()">Show All</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Log ID</th>
                    <th>User ID</th>
                    <th>Employee Name</th>
                    <th>Date & Time</th>
                </tr>
            </thead>
            <tbody id="logs-table-body">
                <tr><td colspan="4">Loading records...</td></tr>
            </tbody>
        </table>
    </div>
    
    <div class="container" id="camera-container">
        <video id="video" width="640" height="480" autoplay muted></video>
    </div>
    
    <div id="status">Initializing system...</div>

    <script>
        const video = document.getElementById('video');
        const statusEl = document.getElementById('status');
        const regForm = document.getElementById('registration-form');
        const logsView = document.getElementById('logs-view');
        const cameraContainer = document.getElementById('camera-container');
        const btnAttendance = document.getElementById('btn-attendance');
        const btnRegister = document.getElementById('btn-register');
        
        let faceMatcher = null;
        let isSending = false;
        let currentMode = 'attendance';
        let detectionInterval = null;

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
                video.srcObject = stream;
            } catch (err) {
                statusEl.innerText = "Camera access denied or unsupported.";
            }
        }

        async function loadAIModelsAndData() {
            statusEl.innerText = "Loading AI Models...";
            const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
            
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
            ]);

            statusEl.innerText = "Fetching employee face descriptors...";
            await syncEmployeeDescriptors();
            
            btnAttendance.disabled = false;
            btnRegister.disabled = false;

            switchMode('attendance');
        }

        async function syncEmployeeDescriptors() {
            try {
                const res = await fetch('/api/employees');
                const data = await res.json();
                
                if (data.status !== 'success' || !data.employees.length) {
                    statusEl.innerText = "No registered employees found in database.";
                    faceMatcher = null;
                    return;
                }

                const labeledDescriptors = data.employees.map(emp => {
                    const descriptorArray = new Float32Array(Object.values(emp.faceDescriptor));
                    return new faceapi.LabeledFaceDescriptors(
                        emp.userId.toString(), 
                        [descriptorArray]
                    );
                });

                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
            } catch (err) {
                console.error("Failed to sync employee data:", err);
                statusEl.innerText = "Error syncing registered face profiles.";
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            const existingCanvas = document.querySelector('canvas');
            if (existingCanvas) existingCanvas.remove();

            if (mode === 'attendance') {
                regForm.style.display = 'none';
                logsView.style.display = 'none';
                cameraContainer.style.display = 'inline-block';
                statusEl.innerText = "Attendance Mode Active. Scanning for faces...";
                startAttendanceScanning();
            } else if (mode === 'register') {
                clearInterval(detectionInterval);
                logsView.style.display = 'none';
                cameraContainer.style.display = 'inline-block';
                regForm.style.display = 'block';
                statusEl.innerText = "Registration Mode Active. Align face and click Capture.";
            } else if (mode === 'logs') {
                clearInterval(detectionInterval);
                regForm.style.display = 'none';
                cameraContainer.style.display = 'none';
                logsView.style.display = 'block';
                statusEl.innerText = "Viewing Attendance Log Records.";
                fetchAttendanceLogs();
            }
        }

        function startAttendanceScanning() {
            clearInterval(detectionInterval);
            
            const canvas = faceapi.createCanvasFromMedia(video);
            document.querySelector('.container').append(canvas);
            
            const displaySize = { width: video.width, height: video.height };
            faceapi.matchDimensions(canvas, displaySize);

            detectionInterval = setInterval(async () => {
                if (isSending || currentMode !== 'attendance') return;

                const detection = await faceapi
                    .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();

                canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);

                if (detection) {
                    const resizedDetection = faceapi.resizeResults(detection, displaySize);
                    faceapi.draw.drawDetections(canvas, resizedDetection);

                    if (!faceMatcher) {
                        statusEl.innerText = "No registered face profiles to match against.";
                        return;
                    }

                    const match = faceMatcher.findBestMatch(detection.descriptor);
                    
                    if (match.label !== 'unknown') {
                        statusEl.innerText = `Face Matched! Logging attendance...`;
                        recordAttendance(match.label);
                    } else {
                        statusEl.innerText = "Unrecognized face detected.";
                    }
                } else {
                    statusEl.innerText = "Searching for face in frame...";
                }
            }, 2000);
        }

        async function captureAndRegister() {
            const userId = document.getElementById('reg-user-id').value.trim();
            const name = document.getElementById('reg-name').value.trim();

            if (!userId || !name) {
                alert("Please fill in both User ID and Full Name.");
                return;
            }

            statusEl.innerText = "Detecting face vector...";
            const detection = await faceapi
                .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                .withFaceLandmarks()
                .withFaceDescriptor();

            if (!detection) {
                statusEl.innerText = "Registration failed: No face detected in frame. Please look directly at camera.";
                return;
            }

            const faceDescriptor = Array.from(detection.descriptor);

            statusEl.innerText = "Saving employee face profile to database...";
            try {
                const response = await fetch('/api/employees', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, name, faceDescriptor })
                });

                const data = await response.json();
                statusEl.innerText = data.message;

                if (data.status === 'success') {
                    document.getElementById('reg-user-id').value = '';
                    document.getElementById('reg-name').value = '';
                    await syncEmployeeDescriptors();
                }
            } catch (err) {
                console.error("Error registering employee:", err);
                statusEl.innerText = "Failed to transmit registration profile.";
            }
        }

        async function recordAttendance(userId) {
            isSending = true;
            try {
                const response = await fetch('/api/attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId })
                });

                const data = await response.json();
                statusEl.innerText = data.message;

                setTimeout(() => { isSending = false; }, 8000);
            } catch (e) {
                statusEl.innerText = "Network transmission error.";
                isSending = false;
            }
        }

        async function fetchAttendanceLogs() {
            const dateVal = document.getElementById('filter-date').value;
            const tableBody = document.getElementById('logs-table-body');
            tableBody.innerHTML = '<tr><td colspan="4">Loading records...</td></tr>';

            let url = '/api/attendance-logs';
            if (dateVal) {
                url += `?date=${dateVal}`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (data.status === 'success') {
                    if (data.logs.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="4">No attendance records found.</td></tr>';
                        return;
                    }

                    tableBody.innerHTML = data.logs.map(log => `
                        <tr>
                            <td>${log.id}</td>
                            <td>${log.user_id}</td>
                            <td>${log.name}</td>
                            <td>${new Date(log.timestamp).toLocaleString()}</td>
                        </tr>
                    `).join('');
                } else {
                    tableBody.innerHTML = `<tr><td colspan="4">${data.message}</td></tr>`;
                }
            } catch (err) {
                console.error("Error fetching logs:", err);
                tableBody.innerHTML = '<tr><td colspan="4">Error retrieving logs.</td></tr>';
            }
        }

        function clearDateFilter() {
            document.getElementById('filter-date').value = '';
            fetchAttendanceLogs();
        }

        startCamera().then(() => {
            video.addEventListener('play', loadAIModelsAndData);
        });
    </script>
</body>
</html>
